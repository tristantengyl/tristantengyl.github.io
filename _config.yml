title: "Yulin Teng(滕育林)-Homepage"
description: "Yulin Teng's research on trustworthy autonomous UAV cyber-physical systems, physical-layer security, and wireless sensing."
repository: "tristantengyl/tristantengyl.github.io"
url: "https://tristantengyl.github.io"
baseurl: ""
locale: "en-US"
timezone: "Asia/Shanghai"

# The original AcadHomepage design is built on Minimal Mistakes.  This remote
# theme keeps this starter small while GitHub Pages builds it automatically.
remote_theme: "mmistakes/minimal-mistakes"
minimal_mistakes_skin: "default"
plugins:
  - jekyll-include-cache
  - jekyll-remote-theme
  - jekyll-sitemap
  - jekyll-feed

# Optional: set your GA4 measurement ID after the website is online.
analytics:
  provider: "google-gtag"
  google:
    tracking_id: ""
    anonymize_ip: false

author:
  name: "Yulin Teng"
  avatar: "/images/yulin-teng-web.jpg"
  bio: "Incoming Postdoctoral Fellow · HKUST (Dec. 2026)"
  location: "Hong Kong SAR, China"
  employer: "Department of Computer Science and Engineering, HKUST (incoming)"
  uri: ""
  email: "tengyl@njupt.edu.cn"
  github: ""
  googlescholar: ""
  orcid: ""
  dblp: ""
  linkedin: ""
  links:
    - label: "IEEE Author Profile"
      icon: "fas fa-fw fa-book-open"
      url: "https://ieeexplore.ieee.org/author/37090055790"
    - label: "DBLP"
      icon: "fas fa-fw fa-book"
      url: "https://dblp.uni-trier.de/pid/338/4707.html"

defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true
      show_date: false

include:
  - _pages
exclude:
  - README-zh.md
  - CUSTOMIZE-ME.md


